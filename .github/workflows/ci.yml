name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The loader reads the overlay submodule live, so the tests need it materialized.
          submodules: recursive
      # setup-uv publishes no floating major tag past v7, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Install deps
        run: uv sync

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest -q
